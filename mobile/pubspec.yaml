name: resqlink
description: "ResQLink - Emergency Responder Social Network, Incident Coordination Platform and Two-Way Pager Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Navigation & Routing
  go_router: ^14.0.1
  
  # Networking & HTTP
  dio: ^5.4.3+1
  http_parser: ^4.0.2
  
  # WebSockets
  socket_io_client: ^2.0.3+1
  
  # Persistence & Secure Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  
  # UI & Material Design 3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  badges: ^3.1.2
  
  # Device & Media
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  battery_plus: ^6.0.0
  sensors_plus: ^5.0.0
  geolocator: ^11.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

